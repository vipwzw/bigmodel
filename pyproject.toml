[project]
name = "bigmodel-lab"
version = "0.1.0"
description = "单机 Apple Silicon 大模型训练全流程实验课程"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
lab = "bigmodel_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigmodel_lab"]

[dependency-groups]
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "tokenizers>=0.19",
    "accelerate>=0.33",
    "peft>=0.11",
    "trl>=0.9",
    "safetensors>=0.4",
    "modelscope>=1.15",
    "huggingface_hub>=0.23",
]
mlx = [
    "mlx>=0.16",
    "mlx-lm>=0.16",
]
eval = [
    "matplotlib>=3.8",
]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
