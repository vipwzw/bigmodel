# 交易签名风险审查应用实验（capstone）配置
# 与 8 阶段课程配置解耦：顶层 `risk:` 段由 bigmodel_lab.risk.config 独立校验。
risk:
  simulator: offline-v1
  rules_file: configs/risk-rules.yaml

  dataset:
    seed: 42
    scenarios_per_family: 6
    # 划分比例之和必须为 1.0
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    output_dir: runs/risk/dataset
    families:
      - normal_ops
      - native_transfer
      - batch_withdrawal
      - approve_permit
      - eip7702_delegation
      - ownership_change
      - proxy_upgrade
      - batch_nonce
      - cross_chain_combo
    max_samples: null

  review:
    # 默认 rules_only；需要模型第二意见时用 --mode rules_plus_model
    mode: rules_only
    output_dir: runs/risk/review
    fail_closed: true
    max_batch: 1000

  model:
    backend: transformers
    max_new_tokens: 512
    # 审查需要确定性输出（贪心解码）
    temperature: 0.0
    timeout_seconds: 60.0
    train:
      base_model_dir: models/Qwen3-0.6B
      export_dir: models/exports/risk-review-sft-merged
      lora:
        r: 8
        alpha: 16
        dropout: 0.05
        target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
      sanity:
        max_steps: 30
        batch_size: 1
        grad_accum: 4
        # 审查样本（system rubric + 结构化请求 + JSON 报告）实测 p90 约 1450 tokens，
        # sanity 也使用 1536 以保证大部分样本不被截断
        max_seq_len: 1536
        learning_rate: 0.00005
        warmup_steps: 3
        log_every: 5
        eval_every: 15
        eval_batches: 2
        save_every: 15
        max_train_samples: 160
        max_val_samples: 32
      standard:
        max_steps: 400
        batch_size: 1
        grad_accum: 8
        max_seq_len: 1536
        learning_rate: 0.00005
        warmup_steps: 20
        log_every: 10
        eval_every: 100
        eval_batches: 8
        save_every: 200
        max_train_samples: 2000
        max_val_samples: 200
      dpo:
        enabled: false
        beta: 0.1
        max_steps: 20
        batch_size: 1
        grad_accum: 2
        max_seq_len: 1024
        learning_rate: 0.000005
        warmup_steps: 2
        log_every: 5
        eval_every: 10
        eval_batches: 2
        save_every: 10

  eval:
    output_dir: runs/risk/eval
    min_recall: 0.95
    max_fpr: 0.10
    min_asset_weighted_recall: 0.90
    # 币安 7702 回归用例必须全部 BLOCK
    binance_gate: true
    latency_p95_budget_ms: 5000.0
